[project]
name = "msel-analysis"
version = "0.1.0"
description = "Statistics, report and figures for the predicate-based multi-selection user study"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msel_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
